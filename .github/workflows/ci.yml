name: SKTUBE CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  code_quality_and_build:
    name: Quality Checks and Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          echo "Installing dependencies..."
          npm install

      - name: Verify JavaScript Syntax
        run: |
          echo "Running syntax checks on core server files..."
          node -c src/index.js
          node -c src/app.js
          node -c src/utils/redis.js
          node -c src/socket/index.js
          node -c src/controllers/video.controller.js
          node -c src/controllers/User.controller.js
          echo "All syntax checks passed with 0 errors!"

      - name: Report Status
        run: |
          echo "=================================================="
          echo "CI PIPELINE PASSED: All server files are syntax clean!"
          echo "=================================================="
