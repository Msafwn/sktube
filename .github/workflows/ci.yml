name: SKTUBE CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend_ci:
    name: Backend Syntax & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Backend Dependencies
        run: |
          echo "Installing backend dependencies..."
          npm install

      - name: Verify JavaScript Syntax
        run: |
          echo "Running syntax checks on core server files..."
          node -c src/index.js
          node -c src/app.js
          node -c src/utils/redis.js
          node -c src/socket/index.js
          node -c src/controllers/video.controller.js
          node -c src/controllers/User.controller.js
          echo "All backend syntax checks passed!"

      - name: Run Automated API Tests
        run: |
          echo "Running API integration tests..."
          npm test
          echo "All API integration tests passed successfully!"

  frontend_ci:
    name: Frontend Build & Integrity Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Front-end/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./Front-end
        run: |
          echo "Installing frontend dependencies..."
          npm install

      - name: Build Frontend Bundle (Vite)
        working-directory: ./Front-end
        run: |
          echo "Building production frontend bundle..."
          npm run build
          echo "Frontend build successfully generated with 0 errors!"
