name: SKTUBE Automated CI Pipeline

# Trigger on push or pull request to any branch
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  code_quality_and_build:
    name: 🧪 Quality Checks & Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Step 1: Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Step 2: Setup Node.js 20 Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Step 3: Install Backend Dependencies
        run: |
          echo "Installing dependencies..."
          npm install

      - name: 🔍 Step 4: Verify JavaScript Syntax & Integrity
        run: |
          echo "Running Node.js syntax checks on core server files..."
          node -c src/index.js
          node -c src/app.js
          node -c src/utils/redis.js
          node -c src/socket/index.js
          node -c src/controllers/video.controller.js
          node -c src/controllers/User.controller.js
          echo "✅ All syntax checks passed with 0 errors!"

      - name: 🎉 Step 5: Success Announcement
        run: |
          echo "=================================================="
          echo "🚀 CI PIPELINE PASSED: Code is clean and healthy!"
          echo "Ready for Continuous Deployment (CD)."
          echo "=================================================="
