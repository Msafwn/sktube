# ==========================================
# 1. NGINX RATE LIMITING & THROTTLING ZONES
# ==========================================
# Zone 1: General API rate limiting (Max 30 requests/second per IP with burst allowance)
limit_req_zone $binary_remote_addr zone=api_gateway_limit:10m rate=30r/s;

# Zone 2: Strict Authentication rate limiting (Max 10 requests/minute per IP)
limit_req_zone $binary_remote_addr zone=auth_gateway_limit:10m rate=10r/m;

# Return HTTP 429 Too Many Requests when limits are breached
limit_req_status 429;

# ==========================================
# 2. LOAD BALANCER CLUSTER DEFINITION
# ==========================================
upstream backend_cluster {
    # Sticky Session IP Hashing for Socket.IO Handshakes across Worker Containers
    ip_hash;
    server backend-1:8000;
    server backend-2:8000;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Hide NGINX version from attackers
    server_tokens off;

    # ==========================================
    # 3. GLOBAL HTTP SECURITY HEADERS
    # ==========================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression for Ultra-Fast Page Speeds
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ==========================================
    # 4. STRICT THROTTLED AUTH ROUTES
    # ==========================================
    location ~* ^/api/v1/users/(login|register) {
        # Allow burst of 5, smooth throttling queue begins after 2 requests
        limit_req zone=auth_gateway_limit burst=5 delay=2;

        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================
    # 5. GENERAL API PROXY & THROTTLED QUEUE
    # ==========================================
    location /api/ {
        # Allow burst of 20, smooth progressive throttling begins after 10 requests
        limit_req zone=api_gateway_limit burst=20 delay=10;

        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================
    # 6. WEBSOCKETS (Socket.IO) PROXY
    # ==========================================
    location /socket.io/ {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ==========================================
    # 7. VIDEO & MEDIA STREAMING BANDWIDTH THROTTLING
    # ==========================================
    location ~* \.(mp4|webm|ogg|m4v|mkv|avi|mov)$ {
        # Initial burst: Deliver first 3MB at unthrottled maximum speed for instant playback
        limit_rate_after 3m;
        # After 3MB, cap streaming download bandwidth to 600 KB/s per client (saves cloud bandwidth)
        limit_rate 600k;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ==========================================
    # 8. REACT ROUTER SPA FALLBACK
    # ==========================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Caching (1 Year max cache)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
